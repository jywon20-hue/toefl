<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>TOEFL 단어장</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-column phone app, top bar + scrolling body + bottom tabs; highlighter-yellow marks the target word like a marked-up vocab book. */
:root{
  --paper:#f4f6fb; --surface:#ffffff; --ink:#14213d; --muted:#5b6478; --line:#dde2ec;
  --accent:#2f4bd8; --accent-soft:#e6eafd; --mark:#ffe066;
  --good:#1d8456; --good-soft:#e3f4ea; --bad:#c23b2a; --bad-soft:#fbe7e4;
  --display:"Literata", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1322; --surface:#172036; --ink:#e9edf7; --muted:#9ba4ba; --line:#2a3450;
    --accent:#8ea2ff; --accent-soft:#232f57; --mark:rgba(255,214,64,.32);
    --good:#5fd39a; --good-soft:#163a2a; --bad:#ff8a7a; --bad-soft:#41201c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1322; --surface:#172036; --ink:#e9edf7; --muted:#9ba4ba; --line:#2a3450;
  --accent:#8ea2ff; --accent-soft:#232f57; --mark:rgba(255,214,64,.32);
  --good:#5fd39a; --good-soft:#163a2a; --bad:#ff8a7a; --bad-soft:#41201c;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:17px;font-weight:600;margin:0;flex:1;text-wrap:balance}
.back{border:0;background:none;padding:6px;margin-left:-6px;display:flex}
main{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:500;font-size:15px}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e1322}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0e1322}}
.btn.block{width:100%;padding:11px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.say{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.say.sm{width:30px;height:30px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.chap h2{font-size:16px;margin:0 0 2px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.good{background:var(--good-soft);color:var(--good)}
.list{display:flex;flex-direction:column}
.list button{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 2px;display:flex;align-items:center;gap:10px}
.list button:last-child{border-bottom:0}
.list .w{font-family:var(--display);font-weight:600;font-size:17px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--good)}
.head{font-family:var(--display);font-size:var(--headsize,34px);font-weight:700;line-height:1.15;margin:0;hyphens:none}
.nw{white-space:nowrap}
.pos{font-style:italic;color:var(--muted);font-family:var(--display)}
.ko{font-size:19px;font-weight:600;margin-top:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.syn-group{display:flex;gap:8px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}
.syn-group .pos{width:44px;flex:none;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;font-family:var(--display);font-size:15px}
.sent{font-family:var(--display);font-size:18px;line-height:1.6}
mark{background:linear-gradient(transparent 45%, var(--mark) 45%);color:inherit;padding:0 1px;font-weight:600}
.trend{border-left:3px solid var(--accent);padding-left:12px}
.toggle{border:0;background:none;color:var(--accent);padding:4px 0;font-size:14px}
.pager{display:flex;gap:8px}
.pager .btn{flex:1}
.known.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.qtop{display:flex;justify-content:space-between;align-items:center}
.qtype{font-size:13px;font-weight:600;color:var(--accent)}
.prompt-word{font-family:var(--display);font-size:var(--headsize,34px);font-weight:700;line-height:1.15;hyphens:none}
.prompt-ko{font-size:22px;font-weight:600}
.blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--accent);margin:0 2px}
input.ans{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts .btn{font-family:var(--display);font-size:17px;padding:12px 8px}
.opts .btn.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opts .btn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb b.t{font-size:16px}
.fb.ok b.t{color:var(--good)}
.fb.no b.t{color:var(--bad)}
.score{font-family:var(--display);font-size:56px;font-weight:700;line-height:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:9px 4px;font-size:14px}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button.on{color:#0e1322}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{color:#0e1322}}
.set{display:flex;flex-direction:column;gap:8px}
.types{display:flex;flex-direction:column;gap:8px}
.types .btn{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px}
.types .btn span{font-size:13px;color:var(--muted);font-weight:400}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%;z-index:9}
.tap{cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:6px;transition:filter .15s}
.cover{display:flex;align-items:center;justify-content:center;width:100%;min-height:34px;background:var(--line);color:var(--muted);border-radius:8px;font-family:var(--body);font-size:14px;font-weight:500;line-height:1.2}
.cover.big{min-height:46px}
.cover.tall{min-height:72px}
.sense{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.sense .ko{font-size:17px;font-weight:600;margin:0}
.num{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ipa{color:var(--muted);font-size:15px;margin-top:4px}
.penbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--accent)}
.penbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pad{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;height:46%;display:none;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -8px 24px rgba(20,33,61,.14);z-index:8;padding-bottom:env(safe-area-inset-bottom)}
.pad.on{display:flex}
.padbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.padseg{flex:none}
.padseg button{padding:6px 10px;font-size:13px}
.ptool{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 9px;font-size:13px}
.pad canvas{flex:1;width:100%;min-height:0;touch-action:none;display:block;cursor:crosshair;
  background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 63px, var(--line) 63px, var(--line) 64px)}
body.pad-on main{padding-bottom:calc(46vh + 16px)}
body.pad-on nav.tabs{visibility:hidden}
.listen{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--accent);font-weight:600}
.player{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px}
.player .head{font-size:var(--headsize,34px)}
.pmean{font-size:19px;font-weight:600;margin-top:10px;display:flex;flex-direction:column;gap:4px}
.speaking{background:linear-gradient(transparent 60%, var(--mark) 60%);border-radius:4px}
.pctl{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:8px}
.pctl .big{font-size:17px;padding:14px}
.etym{background:var(--accent-soft);border-radius:10px;padding:10px 12px;line-height:1.6;text-align:left}
.hardbtn{width:100%;color:var(--muted)}
.hardbtn.on{background:#fff4cc;border-color:#e0b100;color:#7a5a00}
:root[data-theme="dark"] .hardbtn.on{background:#3a3010;color:#ffd84d;border-color:#8a6d00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hardbtn.on{background:#3a3010;color:#ffd84d;border-color:#8a6d00}}
.star{color:#d49a00}
.hardcard{border-color:#e0b100}
.linkbtn{border:0;background:none;text-align:left;padding:0}
.linkbtn .w{font-family:var(--display);font-weight:600;font-size:18px}
.der{margin-top:8px;font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.pt{white-space:pre-line;line-height:1.6}
.pex{text-align:left;width:100%;display:flex;flex-direction:column;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.pex .sent{font-size:17px}
.headcard{padding:12px 14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:4px}
.meta .ipa{margin:0;font-size:14px}
.meta .der{margin:0;font-size:13px}
.pager .btn{flex:0 0 auto;min-width:84px}
.pager{justify-content:space-between}
.synrow{display:flex;gap:6px 8px;align-items:baseline;flex-wrap:wrap}
.synrow .label{margin:0}
.synrow .chip{padding:2px 8px;font-size:14px}
.exrow{display:flex;gap:8px;align-items:flex-start}
.sense .sent{font-size:16px;line-height:1.5}
.sense .trend{font-size:14px}
.cbody{display:flex;flex-direction:column;gap:10px;position:relative}
.cbody.clip{overflow:hidden}
.cbody.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(transparent,var(--paper));pointer-events:none}
.morebtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:2px 0;align-self:center}
.actbar{position:sticky;bottom:-12px;margin:auto -16px -12px;padding:8px 16px 12px;background:var(--paper);display:flex;gap:8px;border-top:1px solid var(--line)}
.actbar .btn{flex:1;padding:10px 8px;font-size:15px}
.actbar .hardbtn{width:auto}
.actbar .btn.nav{flex:0 0 auto;padding:10px 10px;font-size:14px;color:var(--muted)}
.actbar .btn.nav:disabled{opacity:.4}
.actbar .btn{white-space:nowrap}
.sel{flex:1;font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.empty{text-align:center;padding:30px 10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="app" id="app"></div>
<script>
const STANDALONE = true;
/* ===== 데이터 =====
   words.json: [{ch, title, words:[{w, ipa, senses:[{pos, ko, syn[], ex, pt(출제 포인트, 없으면 ""), q:[빈칸 문장, 정답 형태, 해석]}]}]}] */
let DATA = [];
const WORDS = {};                  // id("3:vast") → word
const KEY = "toefl-voca-v2";
let S = {known:{}, wrong:{}, hard:{}, blurW:false, blurK:false, blurS:false,
         settings:{accent:"en-US", rate:0.9, auto:true, fill:"type", qn:20, en:30, prate:0.4, prep:3, pko:true, pet:true, pex:"both"}};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) S = Object.assign(S, s, {settings:Object.assign(S.settings, s.settings||{})}); } catch(e){}
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function save(){ S.t = Date.now(); saveLocal(); cloudPush(); gsyncPush(); }

/* ===== 구글 드라이브 자동 백업 (독립 앱 전용, Apps Script 웹 앱 사용) ===== */
const GKEY = "toefl-gsync";
let GS = {url:"", key:"", status:"off", last:0, busy:false, dirty:false, timer:null};
try { Object.assign(GS, JSON.parse(localStorage.getItem(GKEY)) || {}); } catch(e){}
GS.status = GS.url ? "wait" : "off";
function gsSave(){ try { localStorage.setItem(GKEY, JSON.stringify({url:GS.url, key:GS.key, last:GS.last})); } catch(e){} }
function gsNewKey(){ const a = new Uint8Array(12); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2,"0")).join(""); }
async function gsCall(body){
  const u = GS.url + (GS.url.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(GS.key);
  const opt = body ? {method:"POST", body, headers:{"Content-Type":"text/plain;charset=utf-8"}, redirect:"follow"} : {redirect:"follow"};
  const r = await Promise.race([fetch(u, opt), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 15000))]);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "fail");
  return j;
}
function gsyncPush(){
  if (!GS.url || GS.status === "keyerror") return;
  clearTimeout(GS.timer);
  GS.timer = setTimeout(async function run(){
    if (GS.busy){ GS.dirty = true; return; }
    GS.busy = true; GS.dirty = false;
    try { await gsCall(JSON.stringify(payload())); GS.status = "ok"; GS.last = Date.now(); gsSave(); }
    catch(e){ GS.status = (e.message === "key") ? "keyerror" : "error"; }
    GS.busy = false;
    if (GS.dirty) run();
    if (V.view === "settings") render();
  }, 1500);
}
function applyRemote(r){
  SYNC_KEYS.forEach(k => { if (r[k] !== undefined) S[k] = JSON.parse(JSON.stringify(r[k])); });
  S.settings = Object.assign({accent:"en-US", rate:0.9, auto:true, fill:"type", qn:20, en:30, prate:0.4, prep:3, pko:true, pet:true, pex:"both"}, S.settings||{});
  ["known","wrong","hard"].forEach(k => { if (!S[k] || typeof S[k] !== "object") S[k] = {}; });
  migrateS(); saveLocal();
}
async function gsyncInit(){
  if (!GS.url) return;
  try {
    const j = await gsCall(null);
    const r = j.data;
    if (r && (r.t || 0) > (S.t || 0)){ applyRemote(r); GS.status = "ok"; GS.last = Date.now(); gsSave(); if (V.view !== "quiz" && V.view !== "player") render(); }
    else { GS.status = "ok"; if (!r || (r.t || 0) < (S.t || 0)) gsyncPush(); }
  } catch(e){ GS.status = (e.message === "key") ? "keyerror" : "error"; }
  if (V.view === "settings") render();
}
function gsScript(){
  return `// TOEFL 단어장 자동 백업 — 이 코드를 그대로 붙여 넣으세요
const KEY = "${GS.key}";
const NAME = "toefl-progress.json";
const FOLDER = "TOEFL 단어장 백업";
function doGet(e){ return handle(e, null); }
function doPost(e){ return handle(e, e.postData ? e.postData.contents : null); }
function handle(e, body){
  if (!e.parameter || e.parameter.key !== KEY) return out({ok:false, error:"key"});
  const it = DriveApp.getFoldersByName(FOLDER);
  const folder = it.hasNext() ? it.next() : DriveApp.createFolder(FOLDER);
  const fs = folder.getFilesByName(NAME);
  let f = fs.hasNext() ? fs.next() : null;
  if (body){
    JSON.parse(body);
    if (f) f.setContent(body); else f = folder.createFile(NAME, body, "application/json");
    const day = Utilities.formatDate(new Date(), "Asia/Seoul", "yyyyMMdd");
    const dn = "toefl-" + day + ".json", ds = folder.getFilesByName(dn);
    if (ds.hasNext()) ds.next().setContent(body); else folder.createFile(dn, body, "application/json");
    const old = folder.getFiles(), limit = new Date(Date.now() - 30*864e5);
    while (old.hasNext()){ const x = old.next(); if (x.getName() !== NAME && x.getDateCreated() < limit) x.setTrashed(true); }
    return out({ok:true});
  }
  return out({ok:true, data: f ? JSON.parse(f.getBlob().getDataAsString()) : null});
}
function out(o){ return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }`;
}

/* ===== 계정 저장 (기기·브라우저가 바뀌어도 유지) ===== */
const CLOUD = {ref:null, status:"wait", busy:false, dirty:false, timer:null};
const SYNC_KEYS = ["known","wrong","hard","exams","settings","blurW","blurK","blurS","t"];
const payload = () => { const o = {}; SYNC_KEYS.forEach(k => { if (S[k] !== undefined) o[k] = S[k]; }); return JSON.parse(JSON.stringify(o)); };
function cloudPush(){
  if (!CLOUD.ref) return;
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(async function run(){
    if (CLOUD.busy){ CLOUD.dirty = true; return; }
    CLOUD.busy = true; CLOUD.dirty = false;
    try { await CLOUD.ref.set(payload()); CLOUD.status = "cloud"; }
    catch(e){ if (e && e.code === "unavailable"){ await sleep(800 + Math.random()*800); try { await CLOUD.ref.set(payload()); CLOUD.status = "cloud"; } catch(e2){ CLOUD.status = "error"; } } else CLOUD.status = "error"; }
    CLOUD.busy = false;
    if (CLOUD.dirty) run();
    if (V.view === "settings") render();
  }, 700);
}
async function cloudInit(){
  try {
    if (!window.claude || typeof window.claude.use !== "function"){ CLOUD.status = "local"; return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user){ CLOUD.status = "local"; return; }
    const id = await user.id();
    if (!id){ CLOUD.status = "local"; return; }
    CLOUD.ref = db.doc("data/users/" + id + "/progress");
    const snap = await Promise.race([CLOUD.ref.get(), sleep(10000).then(() => "timeout")]);
    if (snap === "timeout"){ CLOUD.status = "offline"; return; }
    const r = snap.exists ? snap.data() : null;
    if (r && (r.t || 0) >= (S.t || 0)){
      SYNC_KEYS.forEach(k => { if (r[k] !== undefined) S[k] = JSON.parse(JSON.stringify(r[k])); });
      S.settings = Object.assign({accent:"en-US", rate:0.9, auto:true, fill:"type", qn:20, en:30, prate:0.4, prep:3, pko:true, pet:true, pex:"both"}, S.settings||{});
      ["known","wrong","hard"].forEach(k => { if (!S[k] || typeof S[k] !== "object") S[k] = {}; });
      saveLocal(); CLOUD.status = "cloud";
      if (migrateS()) save();
    } else {
      CLOUD.status = "cloud"; cloudPush();
    }
    if (V.view !== "quiz" && V.view !== "player") render();
  } catch(e){ CLOUD.status = "local"; }
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const norm = s => s.trim().toLowerCase().replace(/[.,!?]/g,"").replace(/\s+/g," ");
const chap = n => DATA.find(c => c.ch === n);

const koAll = x => x.senses.map(s => s.ko).join("; ");
function hl(sent, w){
  const t = esc(sent);
  let first = w.split(/\s+/)[0];
  if (first === "be" && w.split(/\s+/).length > 1) first = w.split(/\s+/)[1];
  const stem = first.length > 5 ? first.replace(/(e|y)$/,"") : first;
  return t.replace(new RegExp("\\b(" + stem.replace(/[-]/g,"\\-") + "[a-z]*)", "gi"), "<mark>$1</mark>");
}

let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices(); } catch(e){} }
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
let curU = null;
function speak(t){
  if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined"){
    toast("여기서는 음성이 안 나와요. 크롬 브라우저에서 열어주세요"); return;
  }
  try {
    loadVoices();
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = S.settings.accent; u.rate = S.settings.rate; u.volume = 1;
    const L = S.settings.accent;
    const v = voices.find(v => v.lang.replace("_","-") === L && /google/i.test(v.name)) || voices.find(v => v.lang.replace("_","-") === L) || voices.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    u.onerror = e => { if (e.error !== "interrupted" && e.error !== "canceled") toast("음성 오류: " + e.error + " (설정 탭의 음성 점검 참고)"); };
    curU = u;
    setTimeout(() => { speechSynthesis.resume(); speechSynthesis.speak(u); }, 60);
  } catch(e){ toast("음성을 재생하지 못했어요: " + e.message); }
}
function ttsStatus(){
  if (!("speechSynthesis" in window)) return {ok:false, msg:"이 화면은 음성 기능이 없어요. Claude 앱 안에서 열면 이렇게 나와요. 크롬에서 링크를 열어주세요."};
  loadVoices();

function fitCard(){
  const m = document.getElementById("main"), b = document.getElementById("cbody"), more = document.getElementById("cmore");
  if (!m || !b || !more) return;
  b.style.maxHeight = "";
  if (V.cexp){ more.hidden = false; return; }
  const cs = getComputedStyle(m), gap = parseFloat(cs.rowGap) || 10;
  let used = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  [...m.children].forEach(el => { if (el !== b && el !== more && !el.hidden) used += el.offsetHeight + gap; });
  const avail = m.clientHeight - used - 30 - gap;
  if (b.scrollHeight > avail + 6 && avail > 120){ b.style.maxHeight = avail + "px"; b.classList.add("clip"); more.hidden = false; }
  else { b.classList.remove("clip"); more.hidden = true; }
}

    const cv = document.createElement("canvas").getContext("2d"); cv.font = "700 100px Literata, Georgia, serif";
    let best = 0; toks.forEach(t => { const w = cv.measureText(t).width; if (w > best){ best = w; HEAD_TOKEN = t; } });
  }
  const cv = document.createElement("canvas").getContext("2d"); cv.font = "700 100px Literata, Georgia, serif";
  const w100 = cv.measureText(HEAD_TOKEN).width || 1;
  const avail = Math.min(window.innerWidth, 560) - 32 - 26 - 44 - 6; // 화면 여백·카드 여백·발음 버튼

}

function makeQ(x, type){
  if (type === "mix") type = pick(["en2ko","ko2en","fill"]);
  const s = pick(x.senses);
  if (type === "fill"){
    const same = Object.values(WORDS).filter(o=>o.w!==x.w && o.senses.some(z=>z.pos===s.pos));
    const local = same.filter(o=>o.ch===x.ch);
    const pool = local.length>=3 ? local : (same.length>=3 ? same : Object.values(WORDS).filter(o=>o.w!==x.w));
    return {type, x, s, opts: shuffle([x.w, ...shuffle(pool).slice(0,3).map(o=>o.w)])};
  }
  return {type, x, s};
}

function judgeKo(input, x){
  const strip = t => t.replace(/\s|\(.*?\)|~/g,"").replace(/(하다|한|함|하는|된|되다|다|의|게|히)$/,"");
  const i = strip(input);
  if (!i) return false;
  const toks = x.senses.flatMap(s => s.ko.split(/[,;·/]/)).map(strip).filter(Boolean);
  return toks.some(t => (i.length>=2 && t.includes(i)) || i.includes(t));
}

  let ok = false, note = "";
  if (q.type === "en2ko") ok = judgeKo(input, x);
  if (q.type === "ko2en") ok = norm(input) === norm(x.w);
  if (q.type === "fill"){
    if (S.settings.fill === "mc") ok = input === x.w;
    else if (norm(input) === norm(qa)) ok = true;
    else if (norm(input) === norm(x.w)){ ok = true; note = `문장에 맞는 형태는 ${qa}예요.`; }
  }
  V.ans = {input, ok, note};
  record(x.id, ok);
  render();
  if (S.settings.auto) speak(q.type === "fill" ? q.s.q[0].replace("____", qa) : x.w);
}
function record(id, ok){
  V.quiz.results[V.quiz.n] = {id, ok};
  if (!ok) S.wrong[id] = (S.wrong[id]||0) + 1;
  else if (V.qsrc === "wrong" && S.wrong[id]){ S.wrong[id]--; if (S.wrong[id] <= 0) delete S.wrong[id]; }
  save();
}

const etSpeech = t => t.replace(/→/g,". 그래서 ").replace(/\+/g,", ").replace(/[()]/g,", ").replace(/,\s*,/g,",").replace(/~/g,"");
const hardBtn = x => `<button class="btn hardbtn ${S.hard[x.id]?"on":""}" data-act="hard" data-w="${esc(x.id)}">${S.hard[x.id]?"★ 어려워요":"☆ 어려워요"}</button>`;

const PL = {playing:false, i:0, r:0, part:"", token:0, wake:null};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const koSpeech = x => x.senses.map(s => s.ko.replace(/~/g,"").replace(/[;]/g,", ")).join(". ");
function pickVoice(lang){
  loadVoices();
  const base = lang.slice(0,2);
  return voices.find(v => v.lang.replace("_","-") === lang && /google/i.test(v.name)) || voices.find(v => v.lang.replace("_","-") === lang) || voices.find(v => v.lang.toLowerCase().startsWith(base));
}
function speakP(text, lang, rate){
  return new Promise(res => {
    if (!("speechSynthesis" in window)) return res();
    let done = false; const fin = () => { if (!done){ done = true; res(); } };
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate; const v = pickVoice(lang); if (v) u.voice = v;
    u.onend = fin; u.onerror = fin; curU = u;
    speechSynthesis.speak(u);
    setTimeout(fin, 2500 + text.length * 220 / rate); // onend가 안 오는 경우 대비
  });
}
async function wakeOn(){ try { if (navigator.wakeLock && !PL.wake) PL.wake = await navigator.wakeLock.request("screen"); } catch(e){} }
function wakeOff(){ try { if (PL.wake) PL.wake.release(); } catch(e){} PL.wake = null; }
async function playLoop(){
  const tk = ++PL.token, words = V.plList, st = S.settings;
  PL.playing = true; wakeOn(); renderIf();
  try { speechSynthesis.cancel(); } catch(e){}
  await sleep(150); if (tk !== PL.token) return;
  while (PL.i < words.length){
    const x = words[PL.i];
    for (; PL.r < st.prep; PL.r++){
      PL.part = "en"; renderIf(); await speakP(x.w, st.accent, st.prate); if (tk !== PL.token) return;
      await sleep(700); if (tk !== PL.token) return;
      if (st.pko){ PL.part = "ko"; renderIf(); await speakP(koSpeech(x), "ko-KR", Math.max(st.prate + 0.2, 0.6)); if (tk !== PL.token) return; }
      await sleep(1100); if (tk !== PL.token) return;
    }
    if (V.plMode === "hard" && st.pet && x.et){ PL.part = "et"; renderIf(); await speakP(etSpeech(x.et), "ko-KR", Math.max(st.prate + 0.3, 0.75)); if (tk !== PL.token) return; await sleep(1200); if (tk !== PL.token) return; }
    if (V.plMode === "hard" && st.pex !== "off"){
      for (let k = 0; k < x.senses.length; k++){
        const z = x.senses[k]; if (!z.ex) continue;
        PL.part = "ex"; PL.exi = k; renderIf(); await speakP(z.ex, st.accent, Math.max(st.prate + 0.1, 0.55)); if (tk !== PL.token) return; await sleep(900); if (tk !== PL.token) return;
        if (st.pex === "both" && z.exko){ PL.part = "exko"; renderIf(); await speakP(z.exko, "ko-KR", Math.max(st.prate + 0.3, 0.75)); if (tk !== PL.token) return; await sleep(1000); if (tk !== PL.token) return; }
      }
    }
    PL.r = 0; PL.i++; await sleep(600); if (tk !== PL.token) return;
  }
  PL.playing = false; PL.i = words.length - 1; PL.part = "done"; wakeOff(); renderIf();
}
function stopPlay(){ PL.token++; PL.playing = false; PL.part = ""; try { speechSynthesis.cancel(); } catch(e){} wakeOff(); }

  const h = `<div class="card set"><p class="label" style="margin:0">학습 기록 저장</p><div><span class="pill ${cs[0]}">${cs[1]}</span></div><div class="small muted">${cs[2]}</div></div>

  <div class="card set"><p class="label" style="margin:0">음성 점검</p>
   <div><span class="pill ${ts.ok?"good":"bad"}">${ts.ok?"사용 가능":"문제 있음"}</span> <span class="small">${esc(ts.msg)}</span></div>
   <button class="btn primary" data-act="say" data-t="Hello. This is a listening test.">소리 테스트</button>
   <div class="small muted">소리가 안 나면: ① 크롬에서 열었는지 ② 미디어 볼륨 ③ 설정 → 일반 → 텍스트 음성 변환(TTS)에서 기본 엔진을 Google로, 영어 음성 데이터 설치</div></div>
  <div class="card set"><p class="label" style="margin:0">발음</p>${seg("setAccent", st.accent, [["en-US","미국식"],["en-GB","영국식"]])}</div>
  <div class="card set"><p class="label" style="margin:0">읽기 속도</p>${seg("setRate", st.rate, [[0.7,"느리게"],[0.9,"보통"],[1.05,"빠르게"]])}</div>
  <div class="card set"><p class="label" style="margin:0">자동 읽기</p><div class="small muted">단어 카드를 열거나 퀴즈 답을 확인하면 바로 읽어줘요.</div>${seg("setAuto", st.auto, [[true,"켜기"],[false,"끄기"]])}</div>
  <div class="card set"><p class="label" style="margin:0">학습 기록</p><div class="small muted">어려운 단어 체크, 오답노트, 시험 기록을 모두 지워요.</div><button class="btn" data-act="reset">${V.confirmReset?"한 번 더 누르면 초기화돼요":"학습 기록 초기화"}</button></div>
  <div class="card set"><p class="label" style="margin:0">기록 옮기기 · 백업</p>
   <div class="small muted">어려운 단어, 오답, 시험 기록을 다른 곳으로 옮길 수 있어요. '내보내기'로 코드를 복사한 뒤, 옮겨 갈 앱의 '가져오기' 칸에 붙여 넣으세요.</div>
   <div class="btns"><button class="btn" data-act="exportData">기록 내보내기</button>${STANDALONE?`<button class="btn" data-act="exportFile">파일로 저장</button>`:""}</div>
   ${V.exportCode?`<textarea id="excode" class="ans" style="font-size:12px;height:90px" readonly>${esc(V.exportCode)}</textarea>`:""}
   <textarea id="imcode" class="ans" style="font-size:12px;height:70px" placeholder="여기에 가져올 코드를 붙여 넣으세요"></textarea>
   <div class="btns"><button class="btn primary" data-act="importData">가져오기</button>${STANDALONE?`<label class="btn" style="text-align:center">파일에서 가져오기<input type="file" id="imfile" accept=".json,.txt" hidden></label>`:""}</div></div>`;
  return shell("설정", h);
}

function render(){
  if (V.view === "loading"){ app.innerHTML = `<main><div class="card empty">단어를 불러오는 중…</div></main>`; return; }
  if (V.view === "error"){ app.innerHTML = `<main><div class="card empty"><b>단어 데이터를 불러오지 못했어요</b><div class="small muted" style="margin-top:4px">인터넷 연결을 확인하고 새로고침해 주세요.</div></div></main>`; return; }
  const m = {hard:hardView, player:playerView, exam:examView, home:homeView, chapter:chapterView, card:cardView, quizSetup:quizSetupView, quiz:quizView, result:resultView, wrong:wrongView, settings:settingsView}[V.view];
  app.innerHTML = m();
  const f = document.getElementById("qform");
  if (f) f.addEventListener("submit", e => { e.preventDefault(); const v = document.getElementById("ans").value; if (!v.trim()) return; answer(v); });
  if (V.view === "card") requestAnimationFrame(fitCard);
}

/* ===== 동작 ===== */
const go = (view, extra) => { if (view !== "player" && V.view === "player") stopPlay(); Object.assign(V, {view}, extra||{}); if (view!=="card" && view!=="quiz") PAD.show(false); render(); const m=document.getElementById("main"); if(m) m.scrollTop=0; };
const ACT = {
  tab: d => { V.tab = d.k; V.confirmReset=false; V.qsrc=null; go(d.k); },
  home: () => { V.tab="home"; go("home"); },
  openCh: d => { V.qsrc=null; go("chapter", {ch: d.ch ? +d.ch : V.ch}); },
  openCard: d => { PAD.clear(); go("card", {i:+d.i, showKo:false, cexp:false}); if (S.settings.auto) speak(chap(V.ch).words[V.i].w); },
  openWord: d => { const x = WORDS[d.w]; V.tab="home"; go("card", {ch:x.ch, i:chap(x.ch).words.indexOf(x)}); },
  prev: () => { if (V.i>0) ACT.openCard({i:V.i-1}); },
  next: () => { if (V.i<chap(V.ch).words.length-1) ACT.openCard({i:V.i+1}); },
  blurW: () => { S.blurW = !S.blurW; save(); render(); },
  blurK: () => { S.blurK = !S.blurK; save(); render(); },
  cmore: () => { V.cexp = !V.cexp; render(); },
  toggleKo: () => { V.showKo = !V.showKo; render(); },
  blurS: () => { S.blurS = !S.blurS; save(); render(); },
  known: () => { const id = chap(V.ch).words[V.i].id; if (S.known[id]) delete S.known[id]; else S.known[id]=1; save(); render(); },
  say: d => speak(d.t),
  pad: () => { PAD.show(!PAD.open); render(); },
  quizSetup: d => { V.qsrc=null; go("quizSetup", {ch:+d.ch}); },
  wrongQuiz: () => { V.qsrc="wrong"; go("quizSetup"); },
  wrongTab: () => { V.tab="wrong"; go("wrong"); },
  setFill: d => { S.settings.fill=d.k; save(); render(); },
  setQn: d => { S.settings.qn=+d.k; save(); render(); },
  start: d => startQuiz(d.k),
  choose: d => answer(d.k),
  giveup: () => answer(""),
  override: () => { const Q=V.quiz, id=Q.qs[Q.n].x.id; Q.results[Q.n].ok=true; if(S.wrong[id]){S.wrong[id]--; if(S.wrong[id]<=0) delete S.wrong[id];} save(); V.ans.ok=true; render(); },
  nextQ: () => { const Q=V.quiz; if (Q.n < Q.qs.length-1){ Q.n++; V.ans=null; PAD.clear(); render(); focusInput(); } else { if (V.qsrc==="exam"){ const r=Q.results, t=new Date(); const [ef, et] = examRange(); S.exams=(S.exams||[]).concat([{r: ef===et ? `Day ${ef}` : `Day ${ef}~${et}`, d:`${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`, ok:r.filter(x=>x.ok).length, n:r.length}]).slice(-30); save(); } go("result"); } },
  quitQuiz: () => { V.qsrc==="wrong" ? ACT.wrongTab() : V.qsrc==="exam" ? ACT.examTab() : go("quizSetup"); },
  playerOpen: () => { stopPlay(); V.plMode="day"; V.plList=chap(V.ch).words; PL.i = 0; PL.r = 0; PL.part = ""; go("player"); playLoop(); },
  hardPlay: () => { const l = hardList(); if (!l.length) return; stopPlay(); V.plMode="hard"; V.plList=l; PL.i = 0; PL.r = 0; PL.part = ""; V.tab="home"; go("player"); playLoop(); },
  hardList: () => { V.tab="home"; go("hard"); },
  hard: d => { if (S.hard[d.w]) delete S.hard[d.w]; else S.hard[d.w]=1; save(); render(); },
  sayKo: d => { stopPlay(); speakP(d.t, "ko-KR", 0.9); },
  plEx: d => { S.settings.pex = d.k; save(); render(); },
  plEt: d => { S.settings.pet = d.k==="true"; save(); render(); },
  plToggle: () => { if (PL.playing){ stopPlay(); render(); } else { if (PL.part==="done"){ PL.i=0; PL.r=0; } playLoop(); } },
  plPrev: () => { const was = PL.playing; stopPlay(); PL.i = Math.max(0, PL.i-1); PL.r = 0; was ? playLoop() : render(); },
  plNext: () => { const was = PL.playing; stopPlay(); PL.i = Math.min(V.plList.length-1, PL.i+1); PL.r = 0; was ? playLoop() : render(); },
  plBack: () => { V.plMode==="hard" ? go("home") : go("chapter"); },
  plRate: d => { S.settings.prate=+d.k; save(); render(); },
  plRep: d => { S.settings.prep=+d.k; if (PL.r >= S.settings.prep) PL.r = 0; save(); render(); },
  plKo: d => { S.settings.pko = d.k==="true"; save(); render(); },
  examTab: () => { V.tab="exam"; V.qsrc=null; go("exam"); },
  examStart: () => { V.qsrc="exam"; startQuiz("mix"); },
  setEn: d => { S.settings.en=+d.k; save(); render(); },
  setAccent: d => { S.settings.accent=d.k; save(); render(); speak("accent"); },
  setRate: d => { S.settings.rate=+d.k; save(); render(); },
  setAuto: d => { S.settings.auto = d.k==="true"; save(); render(); },
  gsCopy: async () => { V.gsShow = true; render(); try { await navigator.clipboard.writeText(gsScript()); toast("코드를 복사했어요. Apps Script에 붙여 넣으세요"); } catch(e){ toast("아래 칸의 코드를 전체 선택해 복사해 주세요"); } },
  gsConnect: async () => {
    let u = (document.getElementById("gsurl")?.value || "").trim();
    const km = u.match(/[?&]key=([0-9a-f]+)/i);
    if (km){ GS.key = km[1]; u = u.replace(/[?&]key=[0-9a-f]+/i, ""); }
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(u)){ toast("주소는 https://script.google.com/macros/s/…/exec 형태여야 해요"); return; }
    GS.url = u; GS.status = "wait"; gsSave(); V.gsEdit = false; render(); toast("연결하는 중이에요…");
    await gsyncInit();
    toast(GS.status === "ok" ? "연결됐어요. 이제 자동으로 백업돼요" : (GS.status === "keyerror" ? "키가 맞지 않아요. 코드를 다시 복사해 붙여 넣고 새로 배포해 주세요" : "연결하지 못했어요. 주소와 배포 설정을 확인해 주세요"));
    render();
  },
  gsNow: async () => { GS.status = "wait"; render(); await gsyncInit(); if (GS.status === "ok"){ gsyncPush(); toast("동기화했어요"); } render(); },
  gsCopyRecover: async () => { const r = GS.url + "?key=" + GS.key; try { await navigator.clipboard.writeText(r); toast("복구용 주소를 복사했어요. 안전한 곳에 보관하세요"); } catch(e){ prompt; toast(r); } },
  gsEdit: () => { V.gsEdit = true; render(); },
  gsOff: () => { GS.url = ""; GS.status = "off"; gsSave(); V.gsEdit = false; render(); toast("자동 백업 연결을 끊었어요"); },
  exportData: async () => {
    const code = "TOEFLV1:" + btoa(unescape(encodeURIComponent(JSON.stringify(payload()))));
    V.exportCode = code; render();
    try { await navigator.clipboard.writeText(code); toast("코드를 복사했어요. 옮겨 갈 앱에 붙여 넣으세요"); }
    catch(e){ toast("아래 칸의 코드를 길게 눌러 전체 복사해 주세요"); const t=document.getElementById("excode"); if(t){ t.focus(); t.select(); } }
  },
  exportFile: () => {
    const blob = new Blob([JSON.stringify(payload())], {type:"application/json"});
    const a = document.createElement("a"); const d = new Date();
    a.href = URL.createObjectURL(blob); a.download = `toefl-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
    document.body.appendChild(a); a.click(); a.remove(); toast("백업 파일을 저장했어요");
  },
  importData: () => { const t = document.getElementById("imcode"); applyImport(t ? t.value : ""); },
  reset: () => { if(!V.confirmReset){ V.confirmReset=true; render(); return; } S.known={}; S.wrong={}; S.hard={}; S.exams=[]; save(); V.confirmReset=false; render(); toast("학습 기록을 초기화했어요"); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f){ e.preventDefault(); f(el.dataset); } });
document.addEventListener("keydown", e => { if ((e.key==="Enter"||e.key===" ") && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); } });

/* ===== 필기 연습장 (S펜) ===== */
const PAD = (() => {
  const el = document.createElement("div");
  el.className = "pad"; el.setAttribute("aria-label","필기 연습장");
  el.innerHTML = `<div class="padbar">
    <span class="small muted grow" id="padhint">S펜으로 써보세요</span>
    <div class="seg padseg"><button data-pad="pen" class="on">펜</button><button data-pad="eraser">지우개</button></div>
    <button class="ptool" data-pad="undo">되돌리기</button>
    <button class="ptool" data-pad="clear">전체 지우기</button>
    <button class="ptool" data-pad="close" aria-label="닫기">닫기</button></div>
    <canvas id="padc"></canvas>`;
  document.body.appendChild(el);
  const cv = el.querySelector("canvas"), ctx = cv.getContext("2d"), hint = el.querySelector("#padhint");
  let strokes = [], cur = null, eraser = false, penSeen = false, open = false;
  const ink = () => getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#14213d";
  function size(){
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    if (!r.width) return;
    cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); redraw();
  }
  function seg(st, a, b){
    ctx.globalCompositeOperation = st.er ? "destination-out" : "source-over";
    ctx.strokeStyle = ink(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.lineWidth = st.er ? 24 : 1.2 + 3.6*((a[2]+b[2])/2);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  function dot(st, p){ if (st.er) return; ctx.globalCompositeOperation="source-over"; ctx.fillStyle=ink(); ctx.beginPath(); ctx.arc(p[0],p[1],0.8+1.8*p[2],0,7); ctx.fill(); }
  function redraw(){
    const r = cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height);
    strokes.forEach(st => { if (st.pts.length===1) dot(st, st.pts[0]); for (let i=1;i<st.pts.length;i++) seg(st, st.pts[i-1], st.pts[i]); });
    ctx.globalCompositeOperation = "source-over";
  }
  const pt = e => { const r = cv.getBoundingClientRect(); const p = e.pointerType==="pen" ? (e.pressure||0.5) : 0.45; return [e.clientX-r.left, e.clientY-r.top, p]; };
  cv.addEventListener("pointerdown", e => {
    if (e.pointerType === "pen" && !penSeen){ penSeen = true; hint.textContent = "펜 인식됨 · 손바닥 터치는 무시해요"; }
    if (e.pointerType === "touch" && penSeen) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const er = eraser || (e.buttons & 32) || (e.pointerType==="pen" && (e.buttons & 2));
    cur = {er: !!er, pts:[pt(e)], id:e.pointerId}; strokes.push(cur); dot(cur, cur.pts[0]);
  });
  cv.addEventListener("pointermove", e => {
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    (list.length ? list : [e]).forEach(ev => { const p = pt(ev), last = cur.pts[cur.pts.length-1]; cur.pts.push(p); seg(cur, last, p); });
    ctx.globalCompositeOperation = "source-over";
  });
  const end = e => { if (cur && e.pointerId === cur.id) cur = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-pad]"); if (!b) return;
    const k = b.dataset.pad;
    if (k === "pen" || k === "eraser"){ eraser = k === "eraser"; el.querySelectorAll(".padseg button").forEach(x=>x.classList.toggle("on", x.dataset.pad===k)); }
    if (k === "undo"){ strokes.pop(); redraw(); }
    if (k === "clear"){ strokes = []; redraw(); }
    if (k === "close"){ api.show(false); render(); }
  });
  window.addEventListener("resize", () => { if (open) size(); });
  const api = {
    get open(){ return open; },
    show(on){ open = on; el.classList.toggle("on", on); document.body.classList.toggle("pad-on", on); if (on) requestAnimationFrame(size); },
    clear(){ strokes = []; cur = null; if (open) redraw(); }
  };
  return api;
})();

function applyImport(text){
  try {
    text = (text || "").trim(); if (!text){ toast("가져올 코드를 붙여 넣어 주세요"); return; }
    const obj = text.startsWith("TOEFLV1:") ? JSON.parse(decodeURIComponent(escape(atob(text.slice(8))))) : JSON.parse(text);
    if (!obj || typeof obj !== "object" || !("known" in obj || "hard" in obj || "wrong" in obj)) throw 0;
    SYNC_KEYS.forEach(k => { if (obj[k] !== undefined && k !== "t") S[k] = obj[k]; });
    S.settings = Object.assign({accent:"en-US", rate:0.9, auto:true, fill:"type", qn:20, en:30, prate:0.4, prep:3, pko:true, pet:true, pex:"both"}, S.settings||{});
    ["known","wrong","hard"].forEach(k => { if (!S[k] || typeof S[k] !== "object") S[k] = {}; });
    migrateS(); save(); V.exportCode = null; render();
    toast(`가져왔어요: 어려운 단어 ${Object.keys(S.hard).length}개, 오답 ${Object.keys(S.wrong).length}개`);
  } catch(e){ toast("코드를 읽지 못했어요. 처음부터 끝까지 빠짐없이 붙여 넣었는지 확인해 주세요"); }
}
document.addEventListener("change", e => {
  if (e.target && (e.target.id === "exFrom" || e.target.id === "exTo")){ S.settings[e.target.id] = +e.target.value; save(); render(); return; }
  if (e.target && e.target.id === "imfile" && e.target.files[0]){ e.target.files[0].text().then(applyImport); }
});
const BYW = {};
function migrateS(){
  let changed = false;
  ["known","wrong","hard"].forEach(k => {
    const o = S[k] || {}, n = {};
    Object.keys(o).forEach(id => {
      if (WORDS[id]) { n[id] = o[id]; return; }
      const w = id.slice(id.indexOf(":") + 1), nid = BYW[w];
      if (nid){ n[nid] = Math.max(n[nid] || 0, o[id]); changed = true; } else changed = true;
    });
    S[k] = n;
  });
  return changed;
}
function init(data){
  DATA = data;
  DATA.forEach(c => c.words.forEach(x => { x.ch = c.ch; x.id = c.ch + ":" + x.w; WORDS[x.id] = x; BYW[x.w] = x.id; }));
  if (migrateS()) saveLocal();
  fitHead();
  try { document.fonts && document.fonts.load("700 40px Literata").then(() => { HEAD_TOKEN = ""; fitHead(); }); } catch(e){}
  window.addEventListener("resize", () => { fitHead(); if (V.view === "card") fitCard(); });
  go("home");
  cloudInit();
  if (STANDALONE) gsyncInit();
}
render();
(window.INLINE_DATA ? Promise.resolve(window.INLINE_DATA) : fetch("words.json").then(r => { if (!r.ok) throw 0; return r.json(); })).then(init).catch(() => go("error"));
if (STANDALONE && "serviceWorker" in navigator && location.protocol === "https:") { try { navigator.serviceWorker.register("sw.js"); } catch(e){} }

</script>
